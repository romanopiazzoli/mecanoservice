  --accent:#4aa3e3; --accent-ink:#0b1a26; --accent-soft:#1b3346; --s-entr:#8796a3; --s-sin:#56636e; color-scheme:dark}

<script>
/* =====================================================================
   CONFIGURACIÓN — pega aquí los datos de tu proyecto de Supabase
   (Supabase → Project Settings → API)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://owcsberqjjbvnnikzozl.supabase.co",      // ej: https://abcdxyz.supabase.co
  SUPABASE_KEY: "sb_publishable_YrW8pS3gJWWmTOT6Gru0Mw_00tIMAnw",  // la clave "publishable" o "anon public"
  EMAIL_TALLER: "taller@mecanoservice.cl"      // el usuario que creaste en Supabase
};
/* ===================================================================== */

let sb = null;
const subs = {};
async function fetchCol(col){
  const {data,error} = await sb.from(col).select("id,data").limit(10000);
  if(error) throw error;
  const snap = {docs:data.map(r=>({id:r.id,exists:true,data:()=>r.data||{}})),empty:!data.length,size:data.length};
  (subs[col]||[]).forEach(s=>s.next(snap));
}
function refresh(col){
  clearTimeout(refresh["t"+col]);
  refresh["t"+col] = setTimeout(()=>fetchCol(col).catch(e=>{
    if(e?.code==="PGRST301"||/JWT/i.test(e?.message||"")){location.reload();return}
    (subs[col]||[]).forEach(s=>s.err&&s.err({code:"unavailable",message:e.message}));
  }),120);
}
const shimDb = {
  collection(col){
    const q = {
      limit(){return q},
      onSnapshot(next,err){(subs[col]=subs[col]||[]).push({next,err});refresh(col);return()=>{}},
      async add(data){
        const {data:r,error} = await sb.from(col).insert({data}).select("id").single();
        if(error) throw error; refresh(col); return {id:r.id};
      },
      doc(id){return{
        id,
        async update(p){
          const {data:cur,error:e1} = await sb.from(col).select("data").eq("id",id).single();
          if(e1) throw e1;
          const {error} = await sb.from(col).update({data:{...(cur.data||{}),...p}}).eq("id",id);
          if(error) throw error; refresh(col);
        },
        async delete(){
          const {error} = await sb.from(col).delete().eq("id",id);
          if(error) throw error; refresh(col);
        }
      }}
    };
    return q;
  }
};
const shimAssets = {
  async delete(id){const {error}=await sb.storage.from("fotos").remove([id]);if(error)throw error;},
  async upload(blob){
    const ext = ((blob.type||"").split("/")[1]||"jpg").replace("jpeg","jpg");
    const path = `${new Date().toISOString().slice(0,7)}/${crypto.randomUUID()}.${ext}`;
    const {error} = await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type||"image/jpeg"});
    if(error) throw error;
    const {data} = sb.storage.from("fotos").getPublicUrl(path);
    return {id:path,url:data.publicUrl,sizeBytes:blob.size,contentType:blob.type};
  }
};
const shimDownloads = {
  async save({filename,data}){
    const b = data instanceof Blob ? data : new Blob([data]);
    const u = URL.createObjectURL(b);
    const a = document.createElement("a"); a.href=u; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
    return {status:"saved"};
  }
};
const shimUser = {name:async()=>"Taller",isOwner:async()=>true,can:async()=>true,canEdit:async()=>true};
window.claude = {use:async n=>({db:shimDb,assets:shimAssets,downloads:shimDownloads,user:shimUser})[n]||null};

function showLogin(msg="",fatal=false){
  const el=document.getElementById("login");el.hidden=false;
  document.getElementById("lmsg").textContent=msg;
  document.getElementById("lform").hidden=fatal;
  if(!fatal)setTimeout(()=>document.getElementById("lpass").focus(),50);
}
async function enter(){
  document.getElementById("login").hidden=true;
  sb.channel("taller").on("postgres_changes",{event:"*",schema:"public"},p=>{if(["clientes","ordenes","garantias"].includes(p.table))refresh(p.table)}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)["clientes","ordenes","garantias"].forEach(refresh)});
  boot();
}
async function startApp(){
  document.querySelectorAll("[data-logo]").forEach(i=>i.src=LOGO);document.getElementById("fav").href=LOGO;
  if(/PEGAR/.test(CONFIG.SUPABASE_URL+CONFIG.SUPABASE_KEY)){showLogin("Falta configurar la plataforma: pega la dirección y la clave de Supabase al inicio del archivo index.html.",true);return}
  if(!window.supabase){showLogin("No se pudo cargar la plataforma. Revisa tu conexión a internet y recarga la página.",true);return}
  sb = supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
  const {data:{session}} = await sb.auth.getSession();
  if(session) enter(); else showLogin();
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="lform")return; e.preventDefault();
  const btn=e.target.querySelector("button"),msg=document.getElementById("lmsg");
  btn.disabled=true; msg.textContent="Entrando…";
  const {error} = await sb.auth.signInWithPassword({email:CONFIG.EMAIL_TALLER,password:document.getElementById("lpass").value});
  btn.disabled=false;
  if(error){msg.textContent=/invalid/i.test(error.message)?"Clave incorrecta. Intenta de nuevo.":"No se pudo entrar: "+error.message;return}
  msg.textContent=""; document.getElementById("lpass").value=""; enter();
});
document.addEventListener("click",async e=>{
  if(!e.target.closest('[data-act="salir"]'))return;
  await sb.auth.signOut(); location.reload();
});
</script>

 wa:'<path fill="currentColor" d="M12 2.5a9.4 9.4 0 0 0-8.1 14.2L2.6 21.5l4.9-1.3A9.4 9.4 0 1 0 12 2.5zm5.4 13.3c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/>',
 box:'<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></g>'};
const svg=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const NAV=[["panel","Panel"],["clientes","Clientes"],["ordenes","Órdenes"],["repuestos","Repuestos"],["garantias","Garantías"]];

const S={clientes:[],ordenes:[],garantias:[],loaded:0,dbOk:null,err:"",ordFilter:"abiertas",ordQ:"",cliQ:"",garTab:"activas",repTab:"pedir",modal:null,q:"",canWrite:true};
let db=null,assets=null,downloads=null,userCap=null;

/* ---------- utilidades ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-CL");
const today=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
const fmtD=d=>{if(!d)return"—";const[y,m,dd]=String(d).slice(0,10).split("-");return `${dd}-${m}-${y}`};
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+Number(n));return x.toISOString().slice(0,10)};
const daysTo=d=>Math.round((new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);
const otNum=n=>"OT-"+String(n||0).padStart(4,"0");
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.\-\s]/g,"");
function rutDV(body){let s=0,m=2;for(let i=body.length-1;i>=0;i--){s+=Number(body[i])*m;m=m===7?2:m+1}const r=11-(s%11);return r===11?"0":r===10?"K":String(r)}
function fmtRut(v){const c=String(v||"").replace(/[^0-9kK]/g,"").toUpperCase();if(c.length<2)return c;const b=c.slice(0,-1),dv=c.slice(-1);return b.replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+dv}
function rutOk(v){const c=String(v||"").replace(/[^0-9kK]/g,"").toUpperCase();if(c.length<2)return false;return rutDV(c.slice(0,-1))===c.slice(-1)}
const cliente=id=>S.clientes.find(c=>c.id===id);
const orden=id=>S.ordenes.find(o=>o.id===id);
const servNom=o=>o.servicio==="mg"?"Mantención general":"Mano de obra";
function totales(o){const rep=(o.repuestos||[]).reduce((a,r)=>a+(Number(r.cantidad)||0)*(Number(r.precio)||0),0);const mo=Number(o.manoObra)||0;const neto=o.esGarantia?0:rep+mo;const iva=Math.round(neto*IVA);return{rep,mo,neto,iva,total:neto+iva}}
function pill(k){const e=EST[k]||EST.diag;return `<span class="pill" style="--c:var(${e.c})">${esc(e.n)}</span>`}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function waNum(c){let n=String(c?.whatsapp||c?.telefono||"").replace(/\D/g,"");if(n.length===9)n="56"+n;if(n.length===8)n="569"+n;return n}
function garEstado(g){const d=daysTo(g.vence);return d<0?"vencida":d<=15?"porvencer":"activa"}

/* ---------- base de datos ---------- */
async function W(fn,okMsg){try{await fn();if(okMsg)toast(okMsg)}catch(e){console.error(e);toast(e?.code==="not_granted"?"No tienes permiso para guardar. Pide acceso de edición.":"No se pudo guardar. Revisa tu conexión e intenta de nuevo.")}}
const upd=(col,id,data)=>W(()=>db.collection(col).doc(id).update({...data,actualizado:new Date().toISOString()}));
function sub(col){
  db.collection(col).limit(1000).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded|=({clientes:1,ordenes:2,garantias:4})[col];clearTimeout(sub.t);render()},
  e=>{S.err="No se pudo leer la base de datos ("+e.code+"). Recarga la página.";render()})}
async function boot(){
  render();
  const to=setTimeout(()=>{if(!S.loaded){S.err="La base de datos está tardando en responder. Revisa tu conexión y recarga.";render()}},10000);sub.t=to;
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){clearTimeout(to);S.dbOk=false;render();return}
  S.dbOk=true;["clientes","ordenes","garantias"].forEach(sub);
  claude.use("assets").then(a=>{assets=a;render()});
  claude.use("downloads").then(d=>{downloads=d});
  claude.use("user").then(async u=>{userCap=u;if(!u)return;const n=await u.name().catch(()=>"");const own=await u.isOwner().catch(()=>false);const cw=await u.can("data.write").catch(()=>null);if(cw===false)S.canWrite=false;document.getElementById("who").textContent=(n?n:"Usuario")+(own?" · Administrador":"");render()});
}

/* ---------- navegación ---------- */
const view=()=>{const h=(location.hash||"#panel").slice(1);return NAV.some(n=>n[0]===h)?h:"panel"};
function renderNav(){const v=view();const pend=pendientes().length;
  document.getElementById("nav").innerHTML=NAV.map(([k,n])=>`<a href="#${k}" class="${v===k?"on":""}">${svg(k)}${n}${k==="repuestos"&&pend?`<span class="badge">${pend}</span>`:""}</a>`).join("");
  document.getElementById("tabbar").innerHTML=NAV.map(([k,n])=>`<a href="#${k}" class="${v===k?"on":""}">${svg(k)}${n}</a>`).join("")}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

function header(title,extra=""){return `<div class="top"><img class="mlogo" src="${LOGO}" alt="" style="display:none;width:38px;height:38px"><h1>${title}</h1><button class="btn sm pri inst" data-act="instalar">Instalar app</button><button class="btn sm salir-m" data-act="salir">Salir</button>
<div class="search">${svg("search")}<input id="gq" type="search" placeholder="Buscar cliente, RUT, teléfono, OT o N° de serie" autocomplete="off" value="${esc(S.q)}" aria-label="Buscar"><div id="gres"></div></div>
${extra}<button class="btn pri big fab-new" data-act="nuevo">${svg("plus")}Nuevo ingreso</button></div>`}

function render(){
  const hm=(location.hash||"").match(/^#ot-([A-Za-z0-9-]+)$/);if(hm&&S.loaded===7){history.replaceState(null,"","#ordenes");const oo=orden(hm[1]);if(oo)S.modal={t:"ord",id:oo.id};else toast("No se encontró esa orden.")}
  renderNav();const v=view();const el=document.getElementById("view");
  if(S.dbOk===false){el.innerHTML=header("Mecano Service")+`<div class="panel empty">${svg("box")}<b>No se pudo conectar con la base de datos.</b><span>Revisa tu conexión a internet y recarga la página.</span></div>`;return}
  if(S.err){el.innerHTML=header("Mecano Service")+`<div class="panel notice">${esc(S.err)}</div>`;return}
  const focusId=document.activeElement?.id,selS=document.activeElement?.selectionStart;
  el.innerHTML=({panel:vPanel,clientes:vClientes,ordenes:vOrdenes,repuestos:vRepuestos,garantias:vGarantias})[v]();
  if(focusId){const f=document.getElementById(focusId);if(f&&f.tagName==="INPUT"){f.focus();try{f.setSelectionRange(selS,selS)}catch(e){}}}
  if(focusId==="gq")showResults();
  safeModal();
}
const loading=()=>S.loaded!==7?`<div class="panel empty"><span>Cargando datos del taller…</span></div>`:"";

/* ---------- vistas ---------- */
function ordRow(o){const c=cliente(o.clienteId);const late=ABIERTOS.includes(o.estado)&&o.estado!=="listo"&&o.fechaEstimada&&daysTo(o.fechaEstimada)<0;
  return `<button class="row" data-ord="${o.id}"><span class="ot">${otNum(o.numero)}</span><div><span class="t">${esc(o.tipo||"Equipo")} ${esc(o.marca||"")} ${esc(o.modelo||"")}${o.esGarantia?' <span class="muted">· garantía</span>':""}</span><span class="s">${esc(c?.nombre||o.clienteNombre||"Sin cliente")} · ingreso ${fmtD(o.fechaIngreso)}${late?` · <b style="color:var(--bad)">atrasada ${-daysTo(o.fechaEstimada)} d</b>`:""}</span></div>${pill(o.estado)}</button>`}
function emptyBox(t,sub,btn=""){return `<div class="empty">${svg("box")}<b>${t}</b><span>${sub}</span>${btn}</div>`}

function vPanel(){
  const O=S.ordenes,ab=O.filter(o=>ABIERTOS.includes(o.estado));
  const k=[["En taller",ab.length,"--steel-d","ordenes","abiertas"],["Esperando repuesto",O.filter(o=>o.estado==="rep").length,"--s-rep","ordenes","rep"],["Listos para retiro",O.filter(o=>o.estado==="listo").length,"--s-listo","ordenes","listo"],["Presupuestos pendientes",O.filter(o=>ABIERTOS.includes(o.estado)&&!o.esGarantia&&o.presupuestoEstado==="Pendiente"&&totales(o).neto>0).length,"--s-aprob","ordenes","presu"],["Garantías activas",S.garantias.filter(g=>garEstado(g)!=="vencida").length,"--accent","garantias","activas"]];
  const late=ab.filter(o=>o.estado!=="listo"&&o.fechaEstimada&&daysTo(o.fechaEstimada)<0).sort((a,b)=>a.fechaEstimada.localeCompare(b.fechaEstimada));
  const pv=S.garantias.filter(g=>garEstado(g)==="porvencer").sort((a,b)=>a.vence.localeCompare(b.vence));
  const ult=[...O].sort((a,b)=>(b.numero||0)-(a.numero||0)).slice(0,6);
  return header("Panel del taller")+(loading()||`
  <div class="kpis">${k.map(([n,v,c,go,f])=>`<button class="kpi" style="--c:var(${c})" data-go="${go}" data-f="${f}"><b>${v}</b><span>${n}</span></button>`).join("")}</div>
  ${!O.length&&!S.clientes.length?`<div class="panel">${emptyBox("Aún no hay equipos registrados","Registra el primer equipo con su cliente, la falla y los accesorios que trae. Aparecerá aquí con su estado.",`<button class="btn pri big" data-act="nuevo">${svg("plus")}Registrar primer ingreso</button>`)}</div>`:""}
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Órdenes atrasadas</h2><span class="muted">${late.length}</span></div>
      <div class="list">${late.map(ordRow).join("")||`<p class="muted">Ninguna orden pasó su fecha estimada de entrega.</p>`}</div></section>
    <section class="panel"><div class="panel-h"><h2>Garantías por vencer</h2><span class="muted">próximos 15 días</span></div>
      <div class="list">${pv.map(garRow).join("")||`<p class="muted">No hay garantías por vencer.</p>`}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Últimos ingresos</h2><a class="btn sm" href="#ordenes">Ver todas</a></div><div class="list">${ult.map(ordRow).join("")||`<p class="muted">Sin ingresos todavía.</p>`}</div></section>`)}

function vClientes(){
  const q=norm(S.cliQ);let L=[...S.clientes].sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es"));
  if(q)L=L.filter(c=>[c.nombre,c.rut,c.telefono,c.whatsapp,c.email,c.comuna].some(x=>norm(x).includes(q)));
  return header("Clientes")+(loading()||`<section class="panel"><div class="panel-h"><div class="field" style="flex:1 1 260px"><input id="cliq" placeholder="Filtrar por nombre, RUT, teléfono o comuna" value="${esc(S.cliQ)}" aria-label="Filtrar clientes"></div><button class="btn" data-act="nuevocli">${svg("plus")}Nuevo cliente</button></div>
  <div class="list">${L.map(c=>{const os=S.ordenes.filter(o=>o.clienteId===c.id);const ab=os.filter(o=>ABIERTOS.includes(o.estado)).length;
   return `<button class="row" data-cli="${c.id}"><span class="mono muted">${esc(c.rut||"sin RUT")}</span><div><span class="t">${esc(c.nombre)}</span><span class="s">${esc(c.telefono||c.whatsapp||"")}${c.comuna?" · "+esc(c.comuna):""} · ${os.length} equipo${os.length===1?"":"s"}</span></div>${ab?`<span class="pill" style="--c:var(--s-repa)">${ab} en taller</span>`:`<span class="muted">—</span>`}</button>`}).join("")||emptyBox(S.clientes.length?"Ningún cliente coincide":"Sin clientes registrados",S.clientes.length?"Prueba con otra parte del nombre o el RUT.":"Los clientes se crean al registrar un ingreso, o con el botón Nuevo cliente.")}</div></section>`)}

function vOrdenes(){
  const f=S.ordFilter,q=norm(S.ordQ);
  let L=[...S.ordenes].sort((a,b)=>(b.numero||0)-(a.numero||0));
  if(f==="abiertas")L=L.filter(o=>ABIERTOS.includes(o.estado));else if(f==="presu")L=L.filter(o=>ABIERTOS.includes(o.estado)&&!o.esGarantia&&o.presupuestoEstado==="Pendiente"&&totales(o).neto>0);else if(f!=="todas")L=L.filter(o=>o.estado===f);
  if(q)L=L.filter(o=>[otNum(o.numero),o.tipo,o.marca,o.modelo,o.serie,cliente(o.clienteId)?.nombre,o.clienteNombre].some(x=>norm(x).includes(q)));
  const chips=[["abiertas","En taller"],...ESTADOS.map(e=>[e.k,e.n]),["presu","Presupuesto pendiente"],["todas","Todas"]];
  return header("Órdenes de trabajo",`<button class="btn" data-act="excel">${svg("xls")}Exportar a Excel</button>`)+(loading()||`<section class="panel">
  <div class="chips">${chips.map(([k,n])=>`<button class="chip ${f===k?"on":""}" data-of="${k}">${esc(n)}</button>`).join("")}</div>
  <div class="field"><input id="ordq" placeholder="Filtrar por OT, equipo, marca, serie o cliente" value="${esc(S.ordQ)}" aria-label="Filtrar órdenes"></div>
  <div class="list">${L.map(ordRow).join("")||emptyBox("No hay órdenes en esta vista","Cambia el filtro o registra un nuevo ingreso.")}</div></section>`)}

function pendientes(){const out=[];S.ordenes.forEach(o=>{if(!ABIERTOS.includes(o.estado))return;(o.repuestos||[]).forEach((r,i)=>{if(r.estado==="Por pedir"||r.estado==="Pedido")out.push({o,r,i})})});return out}
function vRepuestos(){
  const P=pendientes().filter(x=>S.repTab==="pedir"?x.r.estado==="Por pedir":x.r.estado==="Pedido");
  const tot=P.reduce((a,x)=>a+(Number(x.r.cantidad)||0)*(Number(x.r.precio)||0),0);
  return header("Repuestos")+(loading()||`<section class="panel"><div class="panel-h"><h2>${S.repTab==="pedir"?"Repuestos por pedir":"Pedidos en camino"}</h2>
  <div class="chips"><button class="chip ${S.repTab==="pedir"?"on":""}" data-rt="pedir">Por pedir (${pendientes().filter(x=>x.r.estado==="Por pedir").length})</button><button class="chip ${S.repTab==="pedido"?"on":""}" data-rt="pedido">Pedidos (${pendientes().filter(x=>x.r.estado==="Pedido").length})</button></div></div>
  ${P.length?`<div class="tscroll"><table><thead><tr><th>Repuesto</th><th>Código</th><th>Cant.</th><th>Precio neto</th><th>Orden</th><th>Equipo</th><th>Acción</th></tr></thead><tbody>${P.map(({o,r,i})=>`<tr><td><b>${esc(r.nombre)}</b></td><td class="mono">${esc(r.codigo||"—")}</td><td class="num">${esc(r.cantidad)}</td><td class="num">${clp(r.precio)}</td><td><button class="btn sm" data-ord="${o.id}">${otNum(o.numero)}</button></td><td>${esc(o.tipo)} ${esc(o.marca||"")}</td><td>${S.repTab==="pedir"?`<button class="btn sm" data-repset="${o.id}|${i}|Pedido">Marcar pedido</button>`:`<button class="btn sm pri" data-repset="${o.id}|${i}|Recibido">Marcar recibido</button>`}</td></tr>`).join("")}</tbody></table></div><p class="muted num">Total neto ${S.repTab==="pedir"?"a pedir":"en camino"}: <b>${clp(tot)}</b></p>`:emptyBox(S.repTab==="pedir"?"No hay repuestos por pedir":"No hay pedidos pendientes","Los repuestos se agregan dentro de cada orden de trabajo, con su estado.")}
  <p class="notice">Al marcar un repuesto como recibido, si la orden estaba en "Esperando repuesto" y ya no le falta nada, pasa sola a "En reparación".</p></section>`)}

function garRow(g){const c=cliente(g.clienteId);const st=garEstado(g);const d=daysTo(g.vence);const o=g.ordenId?orden(g.ordenId):null;
  return `<button class="row" data-gar="${g.id}"><span class="ot">${g.tipo==="fabrica"?"FÁBRICA":o?otNum(o.numero):"TALLER"}</span><div><span class="t">${esc(g.equipo||"Equipo")}</span><span class="s">${esc(c?.nombre||"Sin cliente")} · vence ${fmtD(g.vence)}${g.serie?" · S/N "+esc(g.serie):""}</span></div><span class="pill" style="--c:var(${st==="vencida"?"--s-sin":st==="porvencer"?"--s-aprob":"--s-listo"})">${st==="vencida"?"Vencida":st==="porvencer"?`Vence en ${d} d`:"Vigente"}</span></button>`}
function vGarantias(){
  const t=S.garTab;let L=[...S.garantias].sort((a,b)=>String(a.vence).localeCompare(String(b.vence)));
  L=L.filter(g=>t==="activas"?garEstado(g)!=="vencida":t==="porvencer"?garEstado(g)==="porvencer":t==="vencidas"?garEstado(g)==="vencida":g.tipo==="fabrica");
  const recl=S.ordenes.filter(o=>o.esGarantia&&ABIERTOS.includes(o.estado));
  return header("Garantías")+(loading()||`<section class="panel"><div class="panel-h"><div class="chips">${[["activas","Vigentes"],["porvencer","Por vencer"],["vencidas","Vencidas"],["fabrica","De fábrica"]].map(([k,n])=>`<button class="chip ${t===k?"on":""}" data-gt="${k}">${n}</button>`).join("")}</div><span style="flex:1"></span><button class="btn" data-act="nuevagar">${svg("plus")}Garantía de fábrica</button></div>
  <div class="list">${L.map(garRow).join("")||emptyBox("No hay garantías en esta vista","Al marcar una reparación como Entregado se crea su garantía de taller. Las garantías de fábrica se registran con el botón de arriba.")}</div></section>
  <section class="panel"><div class="panel-h"><h2>Reclamos de garantía en curso</h2><span class="muted">${recl.length}</span></div><div class="list">${recl.map(ordRow).join("")||`<p class="muted">No hay reclamos abiertos.</p>`}</div></section>`)}

/* ---------- búsqueda global ---------- */
function showResults(){const box=document.getElementById("gres");if(!box)return;const q=norm(S.q);if(q.length<2){box.innerHTML="";return}
  const cs=S.clientes.filter(c=>[c.nombre,c.rut,c.telefono,c.whatsapp,c.email].some(x=>norm(x).includes(q))).slice(0,6);
  const os=S.ordenes.filter(o=>[otNum(o.numero),String(o.numero),o.serie,o.marca+o.modelo].some(x=>norm(x).includes(q))).slice(0,6);
  box.innerHTML=`<div class="results">${cs.map(c=>`<button data-cli="${c.id}">${svg("clientes")}<span><b>${esc(c.nombre)}</b> <span class="muted">${esc(c.rut||"")} ${esc(c.telefono||"")}</span></span></button>`).join("")}${os.map(o=>`<button data-ord="${o.id}"><span class="ot">${otNum(o.numero)}</span><span>${esc(o.tipo)} ${esc(o.marca||"")} <span class="muted">${esc(cliente(o.clienteId)?.nombre||"")}</span></span></button>`).join("")}${!cs.length&&!os.length?`<div style="padding:12px 14px" class="muted">Sin resultados para "${esc(S.q)}"</div>`:""}</div>`}

/* ---------- modales ---------- */
let modalPending=false;
function openModal(m){S.modal=m;renderModal()}
function closeModal(){S.modal=null;document.getElementById("modal").innerHTML="";document.body.style.overflow=""}
function safeModal(){if(!S.modal)return;const a=document.activeElement,m=document.getElementById("modal");if(a&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){modalPending=true;return}renderModal()}
document.getElementById("modal").addEventListener("focusout",()=>setTimeout(()=>{if(modalPending){const a=document.activeElement,m=document.getElementById("modal");if(!(a&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){modalPending=false;renderModal()}}},50));
function shell(title,body,sub=""){return `<div class="modal-bg" data-bg="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}${sub?`<div style="font-family:var(--f-body);font-size:.85rem;font-weight:400;opacity:.75">${sub}</div>`:""}</h2><button class="x" data-act="cerrar" aria-label="Cerrar">×</button></div><div class="modal-b">${body}</div></div></div>`}
function renderModal(){const m=S.modal,el=document.getElementById("modal");if(!m){el.innerHTML="";return}
  const sc=el.querySelector(".modal")?.scrollTop||0;
  const keep=m.t==="nuevo"?[...el.querySelectorAll("input,select,textarea")].filter(x=>x.id&&x.id!=="cq"||(x.name||"").startsWith("acc")).map(x=>[x.id||("acc:"+x.name+":"+x.value),x.type==="checkbox"?x.checked:x.value]):[];
  let h="";

async function guardarIngreso(){const m=S.modal;const err=document.getElementById("nerr");err.textContent="";
  const g=id=>(document.getElementById(id)?.value||"").trim();
  const n=m.nEq||1,eqs=[];
  for(let i=0;i<n;i++){const sel=g("e-tipo-"+i),lbl=n>1?` (herramienta ${i+1})`:"";
    if(sel==="Otro"&&!g("e-tipo-otro-"+i)){err.textContent=`Escribe qué equipo es${lbl}.`;document.getElementById("e-tipo-otro-"+i)?.focus();return}
    if(!g("e-falla-"+i)){err.textContent=`Describe la falla que reporta el cliente${lbl}.`;document.getElementById("e-falla-"+i)?.focus();return}
    const acc=[...document.querySelectorAll(`input[name="acc-${i}"]:checked`)].map(x=>x.value);if(g("e-acc-otro-"+i))acc.push(g("e-acc-otro-"+i));
    eqs.push({tipo:sel==="Otro"?g("e-tipo-otro-"+i):sel,marca:g("e-marca-"+i),modelo:g("e-modelo-"+i),serie:g("e-serie-"+i),accesorios:acc.join(", "),falla:g("e-falla-"+i)})}
  let cid=m.cli,nombreNuevo="";
  if(!cid){if(!m.nuevoCli){err.textContent="Elige un cliente registrado o crea uno nuevo.";return}
    const c=readCli("n");if(!c.nombre){err.textContent="Escribe el nombre del cliente.";return}
    if(c.rut&&!rutOk(c.rut)){err.textContent="El RUT no es válido. Revisa el dígito verificador.";return}
    if(c.rut){const dup=S.clientes.find(x=>norm(x.rut)===norm(c.rut));if(dup){err.textContent=`Ya existe un cliente con ese RUT: ${dup.nombre}. Búscalo y elígelo.`;return}}
    nombreNuevo=c.nombre;
    try{const ref=await db.collection("clientes").add({...c,creado:new Date().toISOString()});cid=ref.id;m.cli=cid;m.nuevoCli=false;S.clientes.push({id:cid,...c})}catch(e){err.textContent="No se pudo crear el cliente. Intenta de nuevo.";return}}
  let numero=Math.max(0,...S.ordenes.map(o=>o.numero||0));const now=new Date().toISOString();const grupo=n>1?"g"+Date.now().toString(36):null;const ids=[];
  try{for(const e of eqs){numero++;
      const data={numero,clienteId:cid,clienteNombre:cliente(cid)?.nombre||nombreNuevo,...e,diagnostico:"",fechaIngreso:g("e-fecha")||today(),fechaEstimada:g("e-est"),tecnico:g("e-tec"),estado:"diag",repuestos:[],manoObra:0,presupuestoEstado:"Pendiente",garantiaDias:90,fotos:[],historial:[{e:"diag",f:now}],creado:now,...(grupo?{grupo}:{})};
      const ref=await db.collection("ordenes").add(data);S.ordenes.push({id:ref.id,...data});ids.push([ref.id,numero])}
    toast(ids.length>1?`Se registraron ${ids.length} equipos: ${ids.map(x=>otNum(x[1])).join(", ")}`:`${otNum(ids[0][1])} registrada`);S.modal={t:"ord",id:ids[0][0]};renderModal()}
  catch(e){err.textContent=ids.length?`Se guardaron ${ids.length} de ${eqs.length} equipos. Revisa tu conexión y registra el resto.`:"No se pudo guardar el ingreso. Revisa tu conexión e intenta de nuevo."}}

async function cambiarEstado(o,k,extra={}){if(o.estado===k)return;const now=new Date().toISOString();const patch={estado:k,historial:[...(o.historial||[]),{e:k,f:now}],...extra};
  if(k==="entr"){patch.fechaEntrega=today();
    if(!S.garantias.some(g=>g.ordenId===o.id)&&Number(o.garantiaDias)>0&&!o.esGarantia){
      await W(()=>db.collection("garantias").add({tipo:"taller",clienteId:o.clienteId,ordenId:o.id,equipo:`${o.tipo} ${o.marca||""} ${o.modelo||""}`.trim(),serie:o.serie||"",inicio:today(),vence:addDays(today(),o.garantiaDias??90),notas:`Garantía de reparación ${otNum(o.numero)} (${o.garantiaDias??90} días)`,creado:now}),"Garantía registrada")}}
  if(k==="aprob"&&o.presupuestoEstado!=="Aprobado")patch.presupuestoEstado="Pendiente";
  await upd("ordenes",o.id,patch)}

async function setRep(o,i,field,val){const reps=(o.repuestos||[]).map(r=>({...r}));if(!reps[i])return;reps[i][field]=(field==="cantidad"||field==="precio")?Number(val)||0:val;const patch={repuestos:reps};
  if(field==="estado"&&val==="Recibido"&&o.estado==="rep"&&!reps.some(r=>r.estado==="Por pedir"||r.estado==="Pedido")){patch.estado="repa";patch.historial=[...(o.historial||[]),{e:"repa",f:new Date().toISOString()}];toast("Repuestos completos: la orden pasó a En reparación")}
  if(field==="estado"&&(val==="Por pedir"||val==="Pedido")&&["diag","repa","aprob"].includes(o.estado)&&o.presupuestoEstado==="Aprobado"){patch.estado="rep";patch.historial=[...(o.historial||[]),{e:"rep",f:new Date().toISOString()}]}
  await upd("ordenes",o.id,patch)}

async function subirFotos(o,files){if(!assets)return;m_upl=o.id;renderModal();const out=[...(o.fotos||[])];
  for(const f of files){try{const blob=await shrink(f);const r=await assets.upload(blob);out.push({id:r.id,url:r.url})}catch(e){toast("Una foto no se pudo subir (máximo 20 MB).")}}
  m_upl=null;await upd("ordenes",o.id,{fotos:out});toast("Fotos guardadas")}
function shrink(file){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)/.test(file.type))return res(file);const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),"image/jpeg",.82);URL.revokeObjectURL(img.src)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

const fotoCache=new Map();
function prefetchFotos(o){grupoDe(o).flatMap(x=>x.fotos||[]).slice(0,6).forEach((f,i)=>{if(fotoCache.has(f.url))return;fotoCache.set(f.url,null);fetch(f.url).then(r=>r.blob()).then(b=>fotoCache.set(f.url,new File([b],`${otNum(o.numero)}-foto${i+1}.jpg`,{type:b.type||"image/jpeg"}))).catch(()=>fotoCache.delete(f.url))})}

   case "avisofoto":if(o)avisoConFoto(o);break;
   case "copylisto":if(o){const txt=msgListo(o);try{await navigator.clipboard.writeText(txt);toast("Texto copiado. Pégalo en tu correo.")}catch(x){toast("No se pudo copiar el texto.")}}break;
   case "copyrecibido":if(o){const txt=msgRecibido(o);try{await navigator.clipboard.writeText(txt);toast("Texto copiado. Pégalo en tu correo.")}catch(x){const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";ta.rows=10;t.after(ta);ta.select();toast("Selecciona y copia el texto")}}break;
   case "delord":m_conf="ord";renderModal();break;
   case "delcli":m_conf="cli";renderModal();break;
   case "delgar":m_conf="gar";renderModal();break;
   case "noconf":m_conf=null;m_delfoto=null;renderModal();break;
   case "delordok":if(o){m_conf=null;const id=o.id;closeModal();await W(()=>db.collection("ordenes").doc(id).delete(),"Orden eliminada")}break;
   case "delcliok":{m_conf=null;const id=S.modal.id;closeModal();await W(()=>db.collection("clientes").doc(id).delete(),"Cliente eliminado");break}
   case "delgarok":{m_conf=null;const id=S.modal.id;closeModal();await W(()=>db.collection("garantias").doc(id).delete(),"Garantía eliminada");break}
   case "nuevagar":openModal({t:"gar"});break;
   case "guardargar":{const g=k=>document.getElementById("g-"+k).value.trim();const er=document.getElementById("gerr");if(!g("cli")||!g("equipo")){er.textContent="Elige el cliente y escribe el equipo.";return}
     const ini=g("inicio")||today();const v=new Date(ini+"T12:00:00");v.setMonth(v.getMonth()+(Number(g("meses"))||12));
     await W(()=>db.collection("garantias").add({tipo:"fabrica",clienteId:g("cli"),equipo:g("equipo"),serie:g("serie"),inicio:ini,vence:v.toISOString().slice(0,10),notas:g("notas"),creado:new Date().toISOString()}),"Garantía guardada");closeModal();break}
   case "reclamo":{const gg=S.garantias.find(x=>x.id===S.modal.id);if(!gg)break;const src=gg.ordenId?orden(gg.ordenId):null;const numero=Math.max(0,...S.ordenes.map(x=>x.numero||0))+1;const now=new Date().toISOString();
     const data={numero,clienteId:gg.clienteId,clienteNombre:cliente(gg.clienteId)?.nombre||"",tipo:src?.tipo||gg.equipo,marca:src?.marca||"",modelo:src?.modelo||"",serie:gg.serie||src?.serie||"",accesorios:"",falla:"Reclamo de garantía: ",diagnostico:"",fechaIngreso:today(),fechaEstimada:"",tecnico:src?.tecnico||"",estado:"diag",repuestos:[],manoObra:0,presupuestoEstado:"Aprobado",garantiaDias:0,fotos:[],historial:[{e:"diag",f:now}],esGarantia:true,garantiaDe:gg.ordenId||null,garantiaId:gg.id,creado:now};
     try{const r=await db.collection("ordenes").add(data);toast(`Reclamo ${otNum(numero)} abierto`);S.ordenes.push({id:r.id,...data});openModal({t:"ord",id:r.id})}catch(x){toast("No se pudo abrir el reclamo.")}break}
  }});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="gq"){S.q=t.value;showResults()}
  else if(t.id==="cliq"){S.cliQ=t.value;render()}
  else if(t.id==="ordq"){S.ordQ=t.value;render()}
  else if(t.id==="cq"){S.modal.cq=t.value;renderModal();const f=document.getElementById("cq");f.focus();f.setSelectionRange(f.value.length,f.value.length)}
  else if(/-rut$/.test(t.id)){const er=document.getElementById(t.id.replace("rut","ruterr"));if(er)er.textContent=t.value.replace(/[^0-9kK]/g,"").length>=7&&!rutOk(t.value)?"Dígito verificador no coincide":""}});
document.addEventListener("change",e=>{const t=e.target,o=S.modal?.t==="ord"?orden(S.modal.id):null;
  if(t.dataset.tipo!==undefined){tipoOtro();if(t.value==="Otro")setTimeout(()=>document.getElementById("e-tipo-otro-"+t.dataset.tipo)?.focus(),50);return}
  if(/-rut$/.test(t.id)&&t.value)t.value=fmtRut(t.value);
  if(!o)return;
  if(t.dataset.of2){const k=t.dataset.of2;let v=t.value;if(k==="manoObra"||k==="garantiaDias")v=Number(v)||0;if(o[k]!==v)upd("ordenes",o.id,{[k]:v})}
  else if(t.dataset.rep){const[i,f]=t.dataset.rep.split("|");setRep(o,Number(i),f,t.value)}
  else if(t.dataset.foto&&t.files?.length){subirFotos(o,[...t.files])}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal()});
document.addEventListener("click",e=>{if(!e.target.closest(".search")){const b=document.getElementById("gres");if(b)b.innerHTML=""}},true);
let instalarEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalarEvt=e;document.body.classList.add("can-install")});
window.addEventListener("appinstalled",()=>{instalarEvt=null;document.body.classList.remove("can-install");toast("App instalada. Búscala en tu pantalla de inicio.")});
document.addEventListener("click",async e=>{if(!e.target.closest('[data-act="instalar"]')||!instalarEvt)return;instalarEvt.prompt();const r=await instalarEvt.userChoice.catch(()=>null);if(r&&r.outcome==="accepted"){instalarEvt=null;document.body.classList.remove("can-install")}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
startApp();
</script>
